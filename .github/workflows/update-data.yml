name: Update housing data

on:
  schedule:
    # Zillow posts new ZHVI figures mid-month. Check on the 18th and 25th (14:00 UTC).
    - cron: "0 14 18,25 * *"
  workflow_dispatch: # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download latest Zillow figures
        run: python3 update_data.py

      - name: Commit if changed
        run: |
          git add data/zhvi.json
          if git diff --cached --quiet; then
            echo "No new data."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Zillow housing data"
          git push
